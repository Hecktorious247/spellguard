<title>Spellguard: Zombie Horde</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2b2350,#120d26);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:none;position:fixed;width:100%}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-weight:700;font-size:16px;gap:6px}
#hud span{background:rgba(0,0,0,.25);padding:4px 9px;border-radius:12px;white-space:nowrap}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.4);touch-action:none}
#bar{padding:6px 8px 8px}
#towers{display:flex;gap:6px;margin-bottom:6px}
.tbtn{flex:1;border:3px solid transparent;border-radius:12px;background:linear-gradient(#4b3b8a,#2c2160);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 8px rgba(0,0,0,.4);color:#fff;padding:5px 2px;font-size:13px;font-weight:700;text-align:center}
.tbtn .ic{font-size:22px;display:block}
.tbtn.sel{border-color:#ffd54a;background:linear-gradient(#6a55c4,#3b2d86);box-shadow:0 0 12px rgba(255,213,74,.6)}
.tbtn.poor{opacity:.45}
#ctrls{display:flex;gap:6px}
button{font-family:inherit;cursor:pointer}
.cbtn{flex:1;border:none;border-radius:12px;background:#ff9f1c;color:#3a2000;font-size:16px;font-weight:800;padding:11px 4px}
.cbtn.alt{background:#4ea8de;color:#06263a;flex:.55}
.cbtn:disabled{opacity:.5}
#panel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:#fffbe9;color:#333;border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none;min-width:260px;text-align:center;z-index:5}
#panel h3{margin:0 0 4px;font-size:17px}
#panel p{margin:0 0 8px;font-size:13px}
#panel .row{display:flex;gap:8px}
#panel button{flex:1;border:none;border-radius:10px;padding:10px;font-weight:800;font-size:15px}
#upg{background:#43aa8b;color:#fff}#sell{background:#f25c54;color:#fff}#pclose{background:#ccc;color:#333;flex:.5!important}
#overlay{position:absolute;inset:0;background:rgba(10,30,20,.85);display:flex;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
#overlay .box{background:#fffbe9;color:#333;border-radius:20px;padding:22px 20px;max-width:340px;width:100%}
#overlay h1{margin:0 0 6px;font-size:30px;color:#5f3dc4;text-shadow:0 2px 0 #ffe066}
#overlay p{font-size:15px;line-height:1.4;margin:8px 0}
#overlay button{margin-top:10px;border:none;border-radius:14px;background:#ff9f1c;color:#3a2000;font-size:20px;font-weight:800;padding:14px 30px}
#hud{font-size:14px}#hud span{padding:4px 7px}
#shop{position:absolute;inset:0;background:rgba(10,8,30,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}
#shop .sbox{background:#fffbe9;color:#333;border-radius:18px;width:100%;max-width:380px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.shead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#3b1f6b;color:#fff;font-size:19px}
.shead button{border:none;background:#ffffff33;color:#fff;border-radius:10px;font-size:18px;padding:6px 12px}
#sGems{font-weight:800;color:#ffe066}
.tabs{display:flex;gap:6px;padding:8px}
.tabs button{flex:1;border:none;border-radius:10px;padding:9px 4px;font-weight:800;font-size:14px;background:#e9e3cf;color:#555}
.tabs button.on{background:#7048e8;color:#fff}
.slist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 8px;flex:1;touch-action:pan-y}
.item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:9px;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.item .ic{font-size:28px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.item .tx{flex:1;font-size:12px;line-height:1.3}.item .tx b{font-size:14px;display:block}
.item button{border:none;border-radius:10px;padding:9px 8px;font-weight:800;font-size:13px;min-width:78px;background:#7048e8;color:#fff}
.item button:disabled{background:#bbb}.item button.eq{background:#43aa8b}
.snote{font-size:11px;text-align:center;color:#777;margin:4px 8px 10px}
#overlay .sbtn{background:#7048e8;color:#fff;font-size:17px;padding:11px 22px;margin-left:6px}
#cmd{position:absolute;inset:0;background:rgba(10,8,30,.94);display:none;flex-direction:column;z-index:15;padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}
#cmd h2{margin:4px 0 8px;text-align:center;font-size:20px}
#cgrid{flex:1;min-height:0;grid-auto-rows:max-content;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:1fr 1fr;gap:8px;touch-action:pan-y;align-content:start}
.cc{border-radius:12px;background:#fffbe9;color:#333;overflow:hidden;border:3px solid transparent;text-align:center}
.cc.on{border-color:#ffd43b;box-shadow:0 0 12px #ffd43b}
.cc .ban{color:#fff;font-size:11px;font-weight:800;padding:3px 2px;text-transform:uppercase;letter-spacing:.5px}
.cc canvas{width:72px;height:72px;border-radius:10px;margin:6px auto 2px;box-shadow:none;display:block}
.cc b{display:block;font-size:13px}.cc i{display:block;font-size:11px;color:#666;font-style:normal}.cc small{display:block;font-size:11px;padding:3px 5px 7px;color:#333}
#cgo{display:flex;gap:8px;margin-top:8px}#cgo button{flex:1;border:none;border-radius:14px;font-size:18px;font-weight:800;padding:13px}
#cStart{background:#ff9f1c;color:#3a2000}#cBack{background:#ccc;color:#333;flex:.4!important}
#hCmd{padding:0!important;overflow:hidden;width:30px;height:30px;flex:none}#hCmd canvas{width:30px;height:30px;box-shadow:none;border-radius:12px}
#toast{position:absolute;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 16px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;white-space:nowrap}

#towers{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:2px;scrollbar-width:none}
#towers::-webkit-scrollbar{display:none}
.tbtn{flex:0 0 72px;padding:4px 2px;font-size:11px;line-height:1.15}
.tbtn .ic{font-size:21px}.tbtn .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbtn .pc{display:block;color:#ffe066}
.tbtn.fac{box-shadow:0 0 0 2px #51cf66 inset}
#spells{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.sbtn2{position:relative;overflow:hidden;flex:1;border:none;border-radius:12px;background:linear-gradient(#2b8a9e,#1b4f72);color:#fff;font-weight:800;padding:5px 2px;font-size:18px;line-height:1}
.sbtn2 small{display:block;font-size:10px;margin-top:2px}.sbtn2 span,.sbtn2 small{position:relative;z-index:1}
.sbtn2 .cdf{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);height:0}
.sbtn2.ready{box-shadow:0 0 10px #66d9e8}.sbtn2.aim{background:linear-gradient(#ff922b,#c92a2a)}
#chg{font-weight:800;color:#ffe066;font-size:13px;min-width:0}
.cc small .up{color:#2b8a3e;font-weight:700}.cc small .dn{color:#c92a2a;font-weight:700}
#panel{bottom:calc(190px + env(safe-area-inset-bottom));max-width:94vw}
#panel p{font-size:12px}

#stages{position:absolute;inset:0;display:none;flex-direction:column;z-index:14;background:linear-gradient(#1b1440,#0d2b2a);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sthead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#3b1f6b;font-size:18px;gap:8px}
.sthead button{border:none;background:#ffffff33;color:#fff;border-radius:10px;font-size:17px;padding:7px 12px;font-weight:800}
#stTot{color:#ffe066;font-weight:800;font-size:14px}
#smap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:relative}
#smapC{position:absolute;left:0;top:0;border-radius:0;box-shadow:none;pointer-events:none}
.snode{position:absolute;width:150px;transform:translateX(-50%);text-align:center;border:none;background:none;color:#fff;padding:0}
.snode .orb{width:78px;height:78px;border-radius:50%;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-size:38px;border:4px solid #ffd43b;box-shadow:0 0 16px rgba(255,212,59,.65),inset 0 -7px 0 rgba(0,0,0,.25)}
.snode.cur .orb{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.snode.lock .orb{filter:grayscale(1) brightness(.55);border-color:#777;box-shadow:none}
.snode b{display:block;font-size:14px;text-shadow:0 2px 3px #000,0 0 4px #000}
